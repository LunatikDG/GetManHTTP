name: Release

on:
  push:
    tags:
      - "v_*"

permissions:
  contents: write

env:
  # Match DT-INF/PROJECT.PMF Runtime-Version (8.3.27) and EDT used for export.
  V8_VERSION: "8.3.27.2130"
  EDT_VERSION: "2025.1.5"

jobs:
  build-and-release:
    name: Build EPF and publish release
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      ONEC_LICENCE: ${{ secrets.ONEC_LICENCE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v_}"
          VERSION="${VERSION//_/.}"
          EPF="bin/GetManHTTP.epf"
          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "epf=${EPF}"
            echo "asset_name=GetManHTTP.epf"
          } >> "${GITHUB_OUTPUT}"

      # EDT 2025.x requires JDK 17 Full with JavaFX. Without it, 1cedtcli fails with
      # javafx/application/Platform ClassNotFoundException and project registration timeout.
      - name: Setup Liberica JDK with JavaFX
        uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: "17"
          java-package: jdk+fx

      - name: Install 1C platform
        uses: 1CDevFlow/onec-setup-action@main
        with:
          type: onec
          onec_version: ${{ env.V8_VERSION }}
          cache: true
        env:
          ONEC_USERNAME: ${{ secrets.ONEC_USERNAME }}
          ONEC_PASSWORD: ${{ secrets.ONEC_PASSWORD }}

      - name: Install 1C EDT
        uses: 1CDevFlow/onec-setup-action@main
        with:
          type: edt
          edt_version: ${{ env.EDT_VERSION }}
          cache: true
        env:
          ONEC_USERNAME: ${{ secrets.ONEC_USERNAME }}
          ONEC_PASSWORD: ${{ secrets.ONEC_PASSWORD }}

      - name: Configure 1C conf.cfg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "C:\Program Files\1cv8\conf" | Out-Null
          $conf = @(
            'DisableUnsafeActionProtection=.*'
            'SystemLanguage=System'
          ) -join "`n"
          Set-Content -Path "C:\Program Files\1cv8\conf\conf.cfg" -Value $conf -Encoding ascii -NoNewline
          Add-Content -Path "C:\Program Files\1cv8\conf\conf.cfg" -Value "" -Encoding ascii

      - name: Install 1C license file
        if: env.ONEC_LICENCE != ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "C:\ProgramData\1C\licenses" | Out-Null
          $Env:ONEC_LICENCE | Out-File -FilePath "C:\ProgramData\1C\licenses\licence.lic" -Encoding ascii

      - name: Build EPF
        shell: pwsh
        run: |
          .\scripts\build-epf.ps1 -OutputEpf "${{ steps.meta.outputs.epf }}"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: GetManHTTP v${{ steps.meta.outputs.version }}
          files: ${{ steps.meta.outputs.epf }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## 🇬🇧 English

            ### What's New
            - **Hierarchical authorization** — auth can be set on collection, folder, or request; default for folders/requests is *Inherit from owner* (collection → folder → request).
            - **Collection settings** — left tabs *General* / *Authorization* for collection-wide auth.
            - Auth UI rebuilt around a parameter schema (Basic / Token); switching auth type clears previous field values.

            ### Bug Fixes
            - Fixed incomplete clearing of authorization fields when changing auth type (#3).

            ### Other
            - Version **${{ steps.meta.outputs.version }}**; settings format **7**.
            - Form title includes version (GetManHTTP v${{ steps.meta.outputs.version }}).
            - The release asset is always GetManHTTP.epf.

            ### Installation
            1. Download ${{ steps.meta.outputs.asset_name }} from this release
            2. Open in 1C via File → Open

            ---

            ## 🇷🇺 Русский

            ### Что нового
            - **Иерархическая авторизация** — на уровне коллекции, папки и запроса; для папок/запросов по умолчанию «Наследовать от владельца» (коллекция → папка → запрос).
            - **Настройки коллекции** — вкладки слева *Общие* / *Авторизация*.
            - UI авторизации на схеме параметров (Basic / Token); при смене типа поля предыдущего типа очищаются.

            ### Исправления
            - Исправлена неполная очистка полей авторизации при смене типа (#3).

            ### Прочее
            - Версия **${{ steps.meta.outputs.version }}**; формат настроек **7**.
            - В заголовке формы — версия (GetManHTTP v${{ steps.meta.outputs.version }}).
            - Релиз всегда формируется файлом GetManHTTP.epf.

            ### Установка
            1. Скачайте ${{ steps.meta.outputs.asset_name }} из этого релиза
            2. Откройте в 1С через Файл → Открыть
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
