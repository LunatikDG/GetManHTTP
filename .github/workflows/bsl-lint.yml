name: BSL Lint

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - ".bsl-language-server.json"
      - ".github/workflows/bsl-lint.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - ".bsl-language-server.json"
      - ".github/workflows/bsl-lint.yml"

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: bsl-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BSL_LANGUAGE_SERVER_VERSION: "1.0.6"

jobs:
  analyze:
    name: BSL Language Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache BSL Language Server
        uses: actions/cache@v4
        with:
          path: .ci/bsl-language-server-${{ env.BSL_LANGUAGE_SERVER_VERSION }}-exec.jar
          key: bsl-ls-${{ env.BSL_LANGUAGE_SERVER_VERSION }}

      - name: Download BSL Language Server
        shell: bash
        run: |
          mkdir -p .ci
          JAR=".ci/bsl-language-server-${BSL_LANGUAGE_SERVER_VERSION}-exec.jar"
          if [[ ! -f "${JAR}" ]]; then
            curl -fsSL \
              -o "${JAR}" \
              "https://github.com/1c-syntax/bsl-language-server/releases/download/v${BSL_LANGUAGE_SERVER_VERSION}/bsl-language-server-${BSL_LANGUAGE_SERVER_VERSION}-exec.jar"
          fi

      - name: Analyze BSL sources
        shell: bash
        run: |
          mkdir -p reports
          java -Xmx2g -jar ".ci/bsl-language-server-${BSL_LANGUAGE_SERVER_VERSION}-exec.jar" analyze \
            --srcDir src \
            --workspaceDir . \
            --configuration .bsl-language-server.json \
            --outputDir reports \
            --reporter junit \
            --reporter console

      - name: Publish analysis results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          check_name: BSL Language Server
          junit_files: reports/**/*.xml
          comment_mode: off

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: bsl-lint-reports
          path: reports/
          if-no-files-found: ignore
