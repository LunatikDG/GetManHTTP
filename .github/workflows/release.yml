name: Release

on:
  push:
    tags:
      - "v_*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build EPF and publish release
    # Self-hosted Windows machine with 1C:Enterprise, 1C:EDT CLI, and a working
    # license (local activation and/or 1C license server on the same host).
    # Register the runner with labels: self-hosted, Windows, onec-build
    # (GitHub → Settings → Actions → Runners, or org-level runner).
    runs-on: [self-hosted, Windows, onec-build]
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        shell: cmd
        run: |
          set "TAG=%GITHUB_REF_NAME%"
          set "VERSION=%TAG:v_=%"
          set "VERSION=%VERSION:_=.%"
          echo tag=%TAG%>> "%GITHUB_OUTPUT%"
          echo version=%VERSION%>> "%GITHUB_OUTPUT%"
          echo epf=bin/GetManHTTP.epf>> "%GITHUB_OUTPUT%"
          echo asset_name=GetManHTTP.epf>> "%GITHUB_OUTPUT%"

      - name: Build EPF
        # Bypass: the runner Windows service account often has a restricted
        # PowerShell execution policy (scripts disabled).
        # EDT Lite lives under the interactive user profile and uses ~/.p2;
        # NETWORK SERVICE was granted ACL on that tree (see maintainer setup).
        shell: cmd
        env:
          ONEC_EDT_CLI: C:\Users\mob_d\AppData\Local\1C\1cedtstart\installations\1C_EDT (Lite) 2025.1\1cedt\1cedtcli.exe
          ONEC_V8_EXE: C:\Program Files (x86)\1cv8\8.3.27.2130\bin\1cv8.exe
          ONEC_EDT_VERSION: "2025.1"
          ONEC_V8_VERSION: "8.3.27"
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-epf.ps1 -OutputEpf "${{ steps.meta.outputs.epf }}"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: GetManHTTP v${{ steps.meta.outputs.version }}
          files: ${{ steps.meta.outputs.epf }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## 🇬🇧 English

            Version **${{ steps.meta.outputs.version }}**. See [CHANGELOG.md](https://github.com/LunatikDG/GetManHTTP/blob/main/CHANGELOG.md) for details.

            ### Installation
            1. Download `${{ steps.meta.outputs.asset_name }}` from this release
            2. Open in 1C via *File → Open*

            ---

            ## 🇷🇺 Русский

            Версия **${{ steps.meta.outputs.version }}**. Подробности — в [CHANGELOG.md](https://github.com/LunatikDG/GetManHTTP/blob/main/CHANGELOG.md).

            ### Установка
            1. Скачайте `${{ steps.meta.outputs.asset_name }}` из этого релиза
            2. Откройте в 1С через *Файл → Открыть*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
