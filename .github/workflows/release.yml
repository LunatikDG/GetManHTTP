name: Release

on:
  push:
    tags:
      - "v_*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build EPF and publish release
    # Self-hosted Windows machine with 1C:Enterprise, 1C:EDT CLI, and a working
    # license (local activation and/or 1C license server on the same host).
    # Register the runner with labels: self-hosted, Windows, onec-build
    # (GitHub → Settings → Actions → Runners, or org-level runner).
    runs-on: [self-hosted, Windows, onec-build]
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        shell: cmd
        run: |
          set "TAG=%GITHUB_REF_NAME%"
          set "VERSION=%TAG:v_=%"
          set "VERSION=%VERSION:_=.%"
          set "VERSION_SLUG=%VERSION:.=-%"
          echo tag=%TAG%>> "%GITHUB_OUTPUT%"
          echo version=%VERSION%>> "%GITHUB_OUTPUT%"
          echo version_slug=%VERSION_SLUG%>> "%GITHUB_OUTPUT%"
          echo epf=bin/GetManHTTP.epf>> "%GITHUB_OUTPUT%"
          echo asset_name=GetManHTTP.epf>> "%GITHUB_OUTPUT%"

      - name: Build EPF
        # Bypass: the runner Windows service account often has a restricted
        # PowerShell execution policy (scripts disabled).
        # Host-specific ONEC_EDT_CLI / ONEC_V8_EXE / ONEC_* go in the runner
        # environment (C:\actions-runner\.env), not in this committed workflow.
        shell: cmd
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-epf.ps1 -OutputEpf "${{ steps.meta.outputs.epf }}"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: GetManHTTP v${{ steps.meta.outputs.version }}
          files: ${{ steps.meta.outputs.epf }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## 🇬🇧 English

            Version **${{ steps.meta.outputs.version }}**. See the [English changelog](https://github.com/LunatikDG/GetManHTTP/blob/main/CHANGELOG.md#changelog-${{ steps.meta.outputs.version_slug }}-en) for details.

            ### Installation
            1. Download `${{ steps.meta.outputs.asset_name }}` from this release
            2. Open in 1C via *File → Open*

            ---

            ## 🇷🇺 Русский

            Версия **${{ steps.meta.outputs.version }}**. Подробности — в [русском разделе CHANGELOG](https://github.com/LunatikDG/GetManHTTP/blob/main/CHANGELOG.md#changelog-${{ steps.meta.outputs.version_slug }}-ru).

            ### Установка
            1. Скачайте `${{ steps.meta.outputs.asset_name }}` из этого релиза
            2. Откройте в 1С через *Файл → Открыть*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
