name: Release

on:
  push:
    tags:
      - "v_*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build EPF and publish release
    # Self-hosted Windows machine with 1C:Enterprise, 1C:EDT CLI, and a working
    # license (local activation and/or 1C license server on the same host).
    # Register the runner with labels: self-hosted, Windows, onec-build
    # (GitHub → Settings → Actions → Runners, or org-level runner).
    runs-on: [self-hosted, Windows, onec-build]
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        shell: pwsh
        run: |
          $tag = $Env:GITHUB_REF_NAME
          $version = $tag -replace '^v_', '' -replace '_', '.'
          $epf = "bin/GetManHTTP.epf"
          "tag=$tag" >> $Env:GITHUB_OUTPUT
          "version=$version" >> $Env:GITHUB_OUTPUT
          "epf=$epf" >> $Env:GITHUB_OUTPUT
          "asset_name=GetManHTTP.epf" >> $Env:GITHUB_OUTPUT

      - name: Build EPF
        shell: pwsh
        run: |
          .\scripts\build-epf.ps1 -OutputEpf "${{ steps.meta.outputs.epf }}"
        # Optional if defaults do not resolve on the runner host:
        # env:
        #   ONEC_EDT_CLI: C:\path\to\1cedtcli.exe
        #   ONEC_V8_EXE: C:\Program Files (x86)\1cv8\8.3.27.xxxx\bin\1cv8.exe
        #   ONEC_EDT_VERSION: "2025.1"
        #   ONEC_V8_VERSION: "8.3.27"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: GetManHTTP v${{ steps.meta.outputs.version }}
          files: ${{ steps.meta.outputs.epf }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## 🇬🇧 English

            Version **${{ steps.meta.outputs.version }}**. See [CHANGELOG.md](https://github.com/LunatikDG/GetManHTTP/blob/main/CHANGELOG.md) for details.

            ### Installation
            1. Download `${{ steps.meta.outputs.asset_name }}` from this release
            2. Open in 1C via *File → Open*

            ---

            ## 🇷🇺 Русский

            Версия **${{ steps.meta.outputs.version }}**. Подробности — в [CHANGELOG.md](https://github.com/LunatikDG/GetManHTTP/blob/main/CHANGELOG.md).

            ### Установка
            1. Скачайте `${{ steps.meta.outputs.asset_name }}` из этого релиза
            2. Откройте в 1С через *Файл → Открыть*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
